# Fly.io deployment: one small machine in Mumbai with SQLite on a persistent volume.
#   fly launch --no-deploy --copy-config --name <your-app-name>   (then update APP_URL below)
#   fly volumes create flowpilot_data --region bom --size 1
#   fly secrets set OPENROUTER_API_KEY=...        (optional: AI drafting)
#   fly deploy
#   npm run smoke -- --base https://<your-app-name>.fly.dev

app = "flowpilot"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATABASE_PATH = "/data/flowpilot.db"
  # Fly's proxy sets Fly-Client-IP on every request, so rate limits see each visitor's own address.
  TRUST_PROXY = "fly"
  REGISTRATION = "open"
  # A public showcase: one-click demo accounts (locked against changes) next to real sign-up.
  DEMO_MODE = "true"
  APP_URL = "https://flowpilot.fly.dev"
  MODEL_PROVIDER = "openrouter"
  MODEL_NAME = "openai/gpt-6-luna"

# SQLite has a single writer: one machine, one volume.
[[mounts]]
  source = "flowpilot_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Stops when idle and wakes on the next request (the volume keeps the data).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
